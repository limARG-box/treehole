<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>树洞空间 treehole</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "微软雅黑", sans-serif;
    color: #1d1d1f;
    min-height: 100vh;
    background-color: #dfe3e8;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: background-image .5s ease;
  }
  body.bg-normal { background-image: url('image1.png'); }
  body.bg-eerie  { background-image: url('image2.png'); }
  body.bg-lien   { background-image: url('image4.png'); }

  .topbar {
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid #e0e0e6;
    padding: 0 24px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-name {
    font-size: 18px;
    font-weight: 700;
    color: #0071e3;
    letter-spacing: 1px;
  }
  .site-name em {
    font-style: normal;
    font-size: 13px;
    color: #86868b;
    font-weight: 400;
    margin-left: 6px;
    letter-spacing: 3px;
    font-family: "SF Mono", Consolas, monospace;
  }
  .top-actions { display: flex; gap: 4px; }
  .top-btn {
    background: transparent;
    border: none;
    color: #0071e3;
    font-size: 14px;
    cursor: pointer;
    padding: 8px 14px;
    border-radius: 6px;
    font-family: inherit;
    transition: background .2s;
  }
  .top-btn:hover { background: rgba(0,113,227,.08); }

  .login-panel {
    max-height: 0;
    overflow: hidden;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: max-height .35s ease, padding .35s ease;
    padding: 0 24px;
    border-bottom: 1px solid transparent;
  }
  .login-panel.open {
    max-height: 240px;
    padding: 16px 24px 18px;
    border-bottom-color: #e0e0e6;
  }
  .login-form {
    max-width: 520px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .login-form input {
    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border: 1px solid #d0d0d5;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
    background: #fff;
  }
  .login-form input:focus { border-color: #0071e3; }
  .login-form button {
    padding: 10px 24px;
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }
  .login-form button:hover { background: #0060c0; }
  .login-err {
    width: 100%;
    color: #e00;
    font-size: 13px;
    min-height: 16px;
    margin-top: 2px;
  }

  .layout {
    max-width: 1020px;
    margin: 0 auto;
    padding: 24px 16px 70px;
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 22px;
    align-items: start;
  }

  .friends-sidebar {
    background: rgba(255,255,255,.94);
    border-radius: 14px;
    padding: 18px 16px;
    box-shadow: 0 1px 10px rgba(0,0,0,.05);
    position: sticky;
    top: 82px;
  }
  .friends-sidebar h2 {
    font-size: 14px;
    margin: 0 0 14px;
    color: #444;
    font-weight: 600;
    letter-spacing: .5px;
    padding-bottom: 10px;
    border-bottom: 1px solid #eee;
  }
  .friend-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }
  .friend-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: 13.5px;
    line-height: 1.35;
  }
  .friend-name {
    color: #222;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    word-break: break-all;
  }
  .friend-name.deleted {
    color: #a8a8a8;
    text-decoration: line-through;
  }
  .friend-note {
    font-size: 11.5px;
    color: #a0a0a0;
  }

  .main-content {
    display: flex;
    flex-direction: column;
    gap: 18px;
    min-width: 0;
  }

  .profile {
    background: rgba(255,255,255,.94);
    border-radius: 16px;
    padding: 22px 24px;
    display: flex;
    gap: 18px;
    align-items: center;
    box-shadow: 0 2px 16px rgba(0,0,0,.07);
  }
  .avatar {
    width: 74px;
    height: 74px;
    border-radius: 50%;
    object-fit: cover;
    background: #d8dde3;
    flex-shrink: 0;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
  }
  .profile-info h1 {
    font-size: 21px;
    margin: 0 0 4px;
    letter-spacing: .5px;
  }
  .profile-account {
    display: inline-block;
    font-size: 12.5px;
    color: #0071e3;
    font-family: "SF Mono", Consolas, monospace;
    margin-bottom: 6px;
    letter-spacing: .5px;
  }
  .profile-info p {
    font-size: 13px;
    color: #86868b;
    margin: 0;
    line-height: 1.6;
  }

  .year-bar {
    display: none;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .year-bar.show { display: flex; }
  .year-btn {
    padding: 7px 20px;
    border: 1px solid rgba(0,0,0,.08);
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 20px;
    font-size: 14px;
    color: #444;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
  }
  .year-btn:hover {
    background: #fff;
    border-color: #0071e3;
    color: #0071e3;
  }
  .year-btn.active {
    background: #0071e3;
    color: #fff;
    border-color: #0071e3;
    box-shadow: 0 2px 8px rgba(0,113,227,.3);
  }

  .feed { display: flex; flex-direction: column; gap: 16px; }
  .post {
    background: rgba(255,255,255,.94);
    border-radius: 14px;
    padding: 18px 20px;
    box-shadow: 0 1px 10px rgba(0,0,0,.05);
  }
  .post time {
    font-size: 12px;
    color: #86868b;
    font-family: "SF Mono", Consolas, monospace;
  }
  .post p {
    margin: 10px 0 0;
    line-height: 1.78;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .empty {
    text-align: center;
    color: #86868b;
    padding: 44px 0;
    font-size: 14px;
  }

  .download-zone {
    text-align: center;
    padding: 8px 0 4px;
  }
  .download-btn {
    background: #0071e3;
    color: #fff;
    border: none;
    padding: 10px 26px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background .2s;
  }
  .download-btn:hover { background: #0060c0; }
  .download-code {
    display: none;
    margin-top: 14px;
    background: rgba(255,255,255,.94);
    border: 1px dashed #d0d0d5;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13px;
    color: #5a5548;
    line-height: 1.9;
    text-align: left;
    font-family: "SF Mono", Consolas, monospace;
    white-space: pre-wrap;
  }
  .download-code.show { display: block; }

  .lock-card {
    text-align: center;
    padding: 30px 20px;
  }
  .lock-icon { font-size: 26px; margin-bottom: 10px; }
  .lock-hint {
    font-size: 14px; color: #1d1d1f; margin-bottom: 6px; font-weight: 600;
  }
  .lock-sub {
    font-size: 13px; color: #86868b; margin-bottom: 16px; line-height: 1.6;
  }
  .lock-form {
    display: flex; justify-content: center; align-items: center;
    gap: 8px; flex-wrap: wrap;
  }
  .lock-input {
    width: 160px; padding: 10px 14px; border: 1px solid #d0d0d5;
    border-radius: 8px; font-size: 14px; text-align: center;
    letter-spacing: 3px; outline: none; font-family: inherit; background: #fff;
  }
  .lock-input:focus { border-color: #0071e3; }
  .lock-btn {
    padding: 10px 22px; border: none; border-radius: 8px;
    background: #0071e3; color: #fff; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .lock-btn:hover { background: #0060c0; }
  .lock-tip {
    color: #e00; font-size: 13px; min-height: 18px; margin-top: 10px;
  }

  .comments {
    background: rgba(255,255,255,.94);
    border-radius: 12px;
    padding: 14px 16px;
    box-shadow: 0 1px 8px rgba(0,0,0,.05);
  }
  .comments h2 {
    font-size: 13px; margin: 0 0 12px; color: #555; font-weight: 600;
    letter-spacing: .5px; padding-bottom: 8px; border-bottom: 1px solid #eee;
  }
  .comment-list {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-direction: column; gap: 10px;
  }
  .comment-item {
    padding-bottom: 10px; border-bottom: 1px dashed #eee;
  }
  .comment-item:last-child { border-bottom: none; padding-bottom: 0; }
  .comment-meta {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 3px; flex-wrap: wrap;
  }
  .comment-user {
    font-size: 12px; color: #0071e3;
    font-family: "SF Mono", Consolas, monospace; font-weight: 600;
  }
  .comment-user.deleted {
    color: #a8a8a8; text-decoration: line-through; font-weight: 500;
  }
  .comment-time {
    font-size: 11px; color: #a0a0a0;
    font-family: "SF Mono", Consolas, monospace;
  }
  .comment-text {
    font-size: 13px; line-height: 1.65; color: #333;
  }
  .comment-text.deleted { color: #888; font-style: italic; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 200; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .modal.open { display: flex; }
  .modal-box {
    background: #fff; border-radius: 14px; padding: 28px 34px;
    text-align: center; max-width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    animation: pop .22s ease;
  }
  @keyframes pop {
    from { transform: scale(.92); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .modal-box p { font-size: 15px; margin: 0 0 22px; color: #333; }
  .modal-box button {
    padding: 9px 30px; background: #0071e3; color: #fff;
    border: none; border-radius: 8px; font-size: 14px;
    cursor: pointer; font-family: inherit;
  }
  .modal-box button:hover { background: #0060c0; }

  /* ===== 404 页面 ===== */
  .page-404 {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
    text-align: center;
    background: #0d0f12;
    color: #c9d1d9;
    font-family: "SF Mono", Consolas, monospace;
  }
  .page-404.show { display: flex; }
  .page-404 .code {
    font-size: 84px;
    font-weight: 700;
    color: #c0392b;
    letter-spacing: 6px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(192,57,43,.5);
  }
  .page-404 .desc {
    font-size: 14px;
    color: #6e7681;
    margin-bottom: 36px;
    letter-spacing: 1px;
  }
  .help-search {
    display: flex;
    width: 100%;
    max-width: 460px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    overflow: hidden;
  }
  .help-search input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #c9d1d9;
    font: inherit;
    padding: 12px 16px;
    font-size: 14px;
  }
  .help-search input::placeholder { color: #6e7681; }
  .help-search button {
    background: #238636;
    color: #fff;
    border: none;
    padding: 0 22px;
    cursor: pointer;
    font: inherit;
    font-size: 14px;
  }
  .help-search button:hover { background: #2ea043; }
  .help-tip {
    margin-top: 14px;
    font-size: 12px;
    color: #6e7681;
    font-style: italic;
    min-height: 16px;
  }
  .help-tip.err { color: #f85149; font-style: normal; }

  /* ===== 红字转场 ===== */
  .red-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    pointer-events: none;
    overflow: hidden;
    opacity: 1;
    transition: opacity .7s ease;
  }
  .red-overlay.fade-out { opacity: 0; }
  .red-overlay span {
    position: absolute;
    color: #c0392b;
    font-weight: 700;
    white-space: nowrap;
    font-family: "Consolas", "SF Mono", monospace;
    text-shadow: 0 0 10px rgba(192,57,43,.9);
    opacity: 0;
    animation: redWordIn .35s ease forwards;
  }
  @keyframes redWordIn {
    from { opacity: 0; transform: scale(.45); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ===== 李恩页面 ===== */
  .page-lien { display: none; }
  .page-lien.show { display: block; }

  @media (max-width: 820px) {
    .layout {
      grid-template-columns: 1fr;
      gap: 18px;
      padding: 16px 12px 60px;
    }
    .friends-sidebar { position: static; order: 2; }
    .main-content { order: 1; }
    .topbar { padding: 0 14px; height: 54px; }
    .site-name { font-size: 16px; }
    .site-name em { font-size: 11px; letter-spacing: 2px; }
    .top-btn { padding: 8px 10px; font-size: 13px; }
    .profile { padding: 18px; gap: 14px; }
    .avatar { width: 62px; height: 62px; }
    .profile-info h1 { font-size: 18px; }
    .year-btn { padding: 6px 16px; font-size: 13px; }
    .post { padding: 16px; }
    .post p { font-size: 14px; }
    .page-404 .code { font-size: 60px; }
  }
</style>
</head>
<body class="bg-normal">

<!-- ===== 主空间 ===== -->
<div id="view-main">
  <nav class="topbar">
    <div class="site-name">树洞空间 <em>treehole</em></div>
    <div class="top-actions">
      <button class="top-btn" onclick="openRegister()">注册</button>
      <button class="top-btn" id="loginBtn" onclick="toggleLoginPanel()">登录</button>
    </div>
  </nav>

  <div class="login-panel" id="loginPanel">
    <div class="login-form">
      <input id="loginUser" placeholder="账号" autocomplete="off">
      <input id="loginPass" type="password" placeholder="密码">
      <button onclick="doLogin()">登录</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>

  <div class="layout">
    <aside class="friends-sidebar">
      <h2>好友访问</h2>
      <ul class="friend-list" id="friendList"></ul>
    </aside>

    <main class="main-content">
      <div class="profile">
        <img id="avatarImg" src="image3.png" class="avatar" alt="">
        <div class="profile-info">
          <h1 id="profileName">双木成林</h1>
          <span class="profile-account" id="profileAccount">@linkai</span>
          <p id="profileSig"></p>
        </div>
      </div>

      <div class="year-bar" id="yearBar"></div>
      <div class="feed" id="feed"></div>

      <div class="comments">
        <h2>评论讨论区</h2>
        <ul class="comment-list" id="commentList"></ul>
      </div>
    </main>
  </div>
</div>

<!-- ===== 404 页面 ===== -->
<div class="page-404" id="view404">
  <div class="code">404</div>
  <div class="desc">你访问的页面不存在，或已被隐藏。</div>
  <div class="help-search">
    <input id="helpInput" placeholder="输入帮助搜索关键词…" autocomplete="off"
           onkeydown="if(event.key==='Enter')doHelpSearch()">
    <button onclick="doHelpSearch()">搜索</button>
  </div>
  <div class="help-tip" id="helpTip"></div>
</div>

<!-- ===== 李恩页面 ===== -->
<div class="page-lien" id="viewLien">
  <nav class="topbar">
    <div class="site-name">树洞空间 <em>treehole</em></div>
    <div class="top-actions">
      <button class="top-btn" onclick="exitLien()">返回</button>
    </div>
  </nav>

  <div class="layout">
    <aside class="friends-sidebar">
      <h2>好友访问</h2>
      <ul class="friend-list" id="lienFriendList"></ul>
    </aside>

    <main class="main-content">
      <div class="profile">
        <img id="lienAvatar" src="" class="avatar" alt="">
        <div class="profile-info">
          <h1 id="lienName">李恩</h1>
          <span class="profile-account" id="lienAccount">@lien_0218</span>
          <p id="lienSig"></p>
        </div>
      </div>

      <div class="year-bar show" id="lienYearBar"></div>
      <div class="feed" id="lienFeed"></div>

      <div class="download-zone">
        <button class="download-btn" onclick="genLienCode()">下载全部内容</button>
        <div class="download-code" id="lienDownloadCode"></div>
      </div>

      <div class="comments">
        <h2>评论讨论区</h2>
        <ul class="comment-list" id="lienCommentList"></ul>
      </div>
    </main>
  </div>
</div>

<!-- ===== 弹窗 ===== -->
<div class="modal" id="modal">
  <div class="modal-box">
    <p id="modalText"></p>
    <button onclick="closeModal()">好的</button>
  </div>
</div>

  { date: '2021-09-01', text: '高中开学第一天。走进教室的时候，大家都在互相打招呼，我低着头找了最后一排靠窗的位置坐下。同桌问我叫什么，我声音小得自己都快听不见。\n\n放学时文昌在校门口等我，他一路上跟三个同学挥手，还跟小卖部阿姨聊了两句。我就在旁边听着，有点羡慕他。' },
  { date: '2022-03-15', text: '今天月考成绩出来，生物比上次进步了 12 分，班主任在讲台上念到我名字的时候，我脸红到脖子根，恨不得钻进桌子里。\n\n但回家路上我还是偷偷笑了。文昌说：“哥你笑起来好看多了，平时老绷着脸。”' },
  { date: '2022-05-12', text: '高一那年学校办过一次密码解密活动，据说最后一道题是老师故意加难的。\n\n我看了一眼，是 ASCII 码。\n\n十分钟就解出来了。\n\n老师在全班面前念了我的名字，还说我“有天赋”。其实我只是背熟了 ASCII 表而已。\n\n文昌后来问我怎么解的。我说就是查表。\n\n他说：“哥你也太认真了。”' },
  { date: '2022-11-20', text: '烦恼：班里组织秋游，要分组做游戏。我本来想躲在一边，结果被硬拉进去。全程没怎么说话，回来之后一直在想——他们会不会觉得我很奇怪。\n\n文昌听完说：“你想太多啦，没人会记得的。”他永远不懂我为什么会在意这些。' },
  { date: '2023-01-10', text: '生物课是我唯一不会走神的课。罗克生老师讲基因编辑的时候，眼睛里像有光。他说：“生命的密码就写在这四个碱基里，人类才刚刚开始读懂它。”\n\n下课后我留下来问了他三个问题，他居然一点没嫌我烦，还借给我一本《分子生物学》。那天回家我走了很久，心里第一次有了一种……想认真做点什么的感觉。\n\n文昌说：“哥你终于有喜欢的东西了。”\n\n其实我还有另一个爱好，没跟多少人说过——密码学。我喜欢把字拆成数字，再拼回去。ASCII 表我背得滚瓜烂熟，每个字母对应哪个码，闭着眼都能写出来。\n\n生物是生命的密码，ASCII 是文字的密码。有时候我觉得，这两件事其实是一回事。' },
  { date: '2023-03-05', text: '今天去办公室找罗老师还书，推门的时候看到他和一个学姐在里面。学姐脸色很难看，罗老师手里拿着一盒牛奶，说：“喝下去，这是好东西，对你只有好处。”\n\n学姐犹豫了一下，还是喝了。\n\n我站在门口没敢出声。罗老师看到我，笑得很温和，说：“林凯，书看完了？有问题随时来问我。”\n\n我点头，退出去了。\n\n可是……生物组的学生，好像都被他这样逼着喝过牛奶。我读过的那点书里，没听说牛奶能让人变成什么样。\n\n可能是我想多了吧。' },
  { date: '2023-04-08', text: '开始喜欢在天台上待着。午休的时候一个人上去，看云，听楼下操场的声音，反而觉得安心。\n\n有次文昌偷偷跟上来，什么也没说，就坐我旁边一起看。过了好久他说：“哥，这儿挺好的。”那天我们俩都没怎么讲话，但不尴尬。' },
  { date: '2023-05-15', text: '今天想起以前的事。\n\n初中的时候，有个校霸总堵我。我从来没跟家里说。\n\n后来文昌知道了。他一个人去找那人，把人揍了一顿。回来的时候手背全是血，还笑着跟我说：“哥，以后有人欺负你，告诉我。”\n\n他比我小两岁。\n\n那天晚上我躲在被子里哭了很久。这事我一直没跟他说过。' },
  { date: '2023-09-11', text: '今天我生日。\n\n其实没打算告诉任何人。早上出门的时候妈妈塞了个鸡蛋给我，说“今天顺顺利利”。\n\n晚自习的时候罗老师把我叫到办公室，从抽屉里拿了一盒牛奶递给我，说：“今天是你生日吧。来，喝了，这是好东西。”\n\n我愣在那里。他笑了笑：“生物组的学籍表上有出生日期，我记性好。”\n\n那盒牛奶我喝了一半，味道和平时一样。\n\n回家路上文昌神神秘秘地从书包里掏出一个纸杯蛋糕，上面歪歪扭扭插着一根蜡烛。他说这是他在小卖部订的，让阿姨帮忙做的。\n\n我说谢谢。他说：“哥你生日当然要过啊。”\n\n今天挺开心的。\n\n9 月 11 号。\n\n九一一。' },
  { date: '2023-09-12', text: '听说那个学姐考上了国内最顶尖的生物大学。\n\n消息传回来的时候，办公室里都在说罗老师教得好。我站在走廊上，第一次那么清楚地感觉到一种东西——羡慕。原来跟着罗老师，真的可以走到那种地方去。\n\n有人说，李恩以前是「寄望实验室」的人。那是罗老师自己带的一个小项目，只收他认可的学生，生物组里也就高年段那么几个人能进去。\n\n那天晚上我翻来覆去睡不着，甚至开始想：那盒牛奶，会不会真的是我误会了？' },
  { date: '2023-11-03', text: '今天的消息，我到现在手还是凉的。\n\n那个学姐——李恩，出事了。\n\n她伤了一个人，然后从楼上跳了下去。人没死，但摔得很重，听说下半辈子都站不起来了。\n\n新闻里只写了短短几行，没有提罗老师，也没有提什么牛奶。可我脑子里全是那天办公室的画面：她脸色发白，手在抖，还是把那盒东西喝了下去。\n\n我谁都没说。文昌问我怎么了一整天不说话，我说没事，就是累。\n\n我不知道该告诉谁，也不知道说了有没有用。' },
  { date: '2023-11-15', text: '文昌今天问我，最近怎么老走神。\n\n我说没事。\n\n他不知道李恩的事。不知道那盒牛奶。不知道那天我在办公室门口看见了什么。\n\n我也不打算让他知道。\n\n他那么开朗，不该沾上这些东西。' },
  { date: '2023-12-31', text: '高三了，压力很大。跨年这天家里一起吃饭，文昌非要拉着我拍合照，我躲了三次还是被他逮住。\n\n照片里他笑得特别灿烂，我嘴角也翘了一点。妈妈把照片设成了手机壁纸。\n\n新的一年，希望自己能再勇敢一点点。' },
  { date: '2024-05-08', text: '罗老师今天找我谈话。\n\n他说，寄望实验室今年想收一个新成员，他考虑了很久，觉得我可以。\n\n我愣在原地，好半天没说出话。那是生物组多少人想进都进不去的地方，只有他认可的学生才有资格。他说：“林凯，你是我见过对生命最诚实的学生。”\n\n我答应了。\n\n回教室的路上，我心跳得很快。可走到楼梯口的时候，我忽然想起李恩——她还躺在医院里，站不起来了。她当年，是不是也站在这条走廊上，听过一模一样的话。\n\n晚上我把这件事用 ASCII 码记了下来。写着写着我停住了——如果哪一天我也出事了，这本子，会不会是唯一能被人读懂的东西。\n\n我没敢往下想。\n\n听说寄望实验室有一个隐藏的论坛，只有里面的人才能进。\n\n今天，我终于可以进去了。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nepohygoloib' },
  { date: '2024-05-12', text: '我不困。我不困。我不困。\n\n牛奶。牛奶。牛奶。为什么是牛奶。\n\n别喝了别喝了别喝了别喝了\n\n207 315 88 88 88 42 42 199 199 199\n\n▇▇▇▇▇▇▇▇\n\n我是谁。\n\n今天几号。\n\n头很胀。手机屏幕亮着，我不知道这条是谁发的。\n\n再看一眼。是我。\n\n不记得了。' },
  { date: '2024-05-20', text: '进实验室两周了。\n\n罗老师让我先熟悉环境，什么都不用做。实验室比我想象的干净，也比我想象的冷。\n\n我今天又没忍住发了火。同桌借我的笔没还，我冲他吼了一句，吼完自己都愣住。我以前不是这样的。\n\n晚上回去头很胀。可能是没睡好。' },
  { date: '2024-05-26', text: '▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇\n\n▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇\n\n▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇▇\n\n▇▇▇' },
  { date: '2024-06-03', text: '今天第一次看到「材料」。\n\n培养皿里，一些很细的东西，几乎透明，在液体里慢慢动。罗老师说，这是从一次科考带回来的，很珍贵。\n\n我看着它，居然一点都不害怕。甚至有点……平静。\n\n回来的路上我一直在想，为什么我会这么镇定。以前的我看这种照片都要绕开。' },
  { date: '2024-06-09', text: '实 验 记 录\n\n第 4 天\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常\n\n一 切 正 常' },
  { date: '2024-06-12', text: '文昌今天来实验室楼下等我。\n\n他一看见我就说：“哥，你是不是瘦了。”\n\n我说没有。\n\n他盯着我看了几秒，没再问。回去的路上一直没怎么说话。\n\n我不能让他知道。\n\n不能让他知道我记不住事。不能让他知道镜子里那个在笑的人不是我。\n\n他要是知道了，一定会去找罗老师。\n\n不能让他去。' },
  { date: '2024-06-18', text: '最近脾气越来越差。\n\n今天为了一件小事跟文昌吵了一架，他愣愣地看着我，说：“哥，你最近怎么了。”\n\n我没回答。回房间后我坐在床边，脑子空了很久。\n\n实验记录我写得很顺，一点错都没有。可我不记得自己是怎么写的。' },
  { date: '2024-06-25', text: '今天又有人问我为什么在笑。\n\n我没有在笑。\n\n我站在洗手间镜子前看了很久，嘴角是平的，眼睛也没弯。\n\n可他们说我在笑。\n\n后来我又去看了一次。\n\n镜子里的我，确实在笑。\n\n不是我。' },
  { date: '2024-07-02', text: '罗老师最近不太对。\n\n他请了好几次假。上次来实验室，脸色铁青，说话有气无力。我问他是不是不舒服，他摆摆手，说没事，让我继续做。\n\n我听说，李恩当年培育的那个东西，到现在还在他手里。\n\n我不敢多问。\n\n可我总想起那盒牛奶。\n\n\n\n我控制不住自己了。\n\n手在打字，脑子是空的。有时候醒过来，已经做完了一件事，不记得什么时候做的。\n\n如果有一天有谁看到这里——\n\n告诉文昌。\n\n不要相信罗克生，和\n\n:)\n\n\n\n 56 49 50 48 95 110 101 105 108' }

  { date: '2017-09-12', text: '今天转学到镇上的初中了。\n\n同学问我从哪里来。我说，山那边。\n\n他们愣了一下，然后笑了。\n\n我知道他们在笑什么。山那边有草鬼婆，山那边的人会下蛊，山那边的孩子不能碰。\n\n我没说话，找了个靠墙的位置坐下。\n\n这是第一周。我打算不惹事。' },
  { date: '2017-10-03', text: '妈妈今天去隔壁村给人看病，回来的时候天都黑了。\n\n我坐在门口等她，远远看见她挎着药箱走过来，脚步很轻。\n\n我说，你累不累。\n\n她说不累，病人好了她就开心。\n\n她把药箱放下，从里面掏出一颗水果糖给我。是那个病人塞给她的。\n\n我含着糖，觉得妈妈是全世界最好的人。' },
  { date: '2018-03-15', text: '班里有人的铅笔丢了。\n\n他们翻我的书包。\n\n一页一页翻，翻得很仔细。\n\n翻完了，什么也没有。\n\n他们没道歉，只是散了。\n\n我站在原地，把书包拉链拉好，回到座位上。\n\n姥姥说过，别跟他们吵。吵也没用。\n\n我知道。' },
  { date: '2018-06-15', text: '今天姥姥教我认草药。\n\n她摊开一大片晒干的叶子，让我闻。\n\n她说，这一味是止血的，这一味是退热的，这一味……她停了停，说，这一味不是救人的。\n\n我问，那是什么。\n\n她没回答，只是把那一味单独收了起来。\n\n我看着她的手。那双手很皱，指甲剪得很短，指腹上有洗不掉的青色。\n\n那天晚上我梦到满山的草在动。' },
  { date: '2018-11-03', text: '姥姥又被村口的人说了。\n\n说她走过的地方，鸡都不下蛋。\n\n说她看一眼谁家小孩，小孩就要发烧。\n\n我在旁边听着，攥紧了拳头。\n\n姥姥拉住我，摇摇头。\n\n回家路上她一直没说话。快到家门口的时候，她忽然说，囡囡，别恨他们。\n\n我说，为什么。\n\n她说，恨一个人，累的是自己。\n\n那天晚上我没睡着。' },
  { date: '2019-04-20', text: '妈妈的小诊所开起来了。\n\n就在村口，两间瓦房，刷了白墙。门口挂了一块木牌，是妈妈自己写的：林氏诊所。\n\n里面只有两张床，一盏灯，一排药架。药架是姥姥帮着搭的。\n\n妈妈把第一张处方贴在墙上，说，以后村里人不用走远路了。\n\n那天来看热闹的人不少。有人进来坐坐，有人远远看着。\n\n妈妈一直笑着。\n\n我知道她心里高兴。' },
  { date: '2019-09-08', text: '今天帮妈妈理药。\n\n有一种药叫甘草，很甜。有一种叫黄连，很苦。\n\n我问妈妈，为什么苦的药也能治病。\n\n她说，因为病有时候比苦还难受。\n\n我说那我以后也要当医生。\n\n妈妈摸摸我的头，说，好啊，但你得先好好读书。\n\n我点头。那天晚上我写作业写到很晚。' },
  { date: '2020-02-14', text: '村里的王叔来诊所了。\n\n他眼睛不好，说是前阵子被石灰溅到了，一直疼。\n\n妈妈给他看了，说问题不大，按时换药就好。\n\n王叔谢了又谢，说林医生你真是好人。\n\n妈妈摆摆手，说都是乡里乡亲。\n\n我站在门边看着。妈妈把药包好，又叮嘱了一遍换药的时辰。\n\n王叔走的时候，回头看了我一眼。我没在意。' },
  { date: '2020-06-08', text: '今天出成绩了。\n\n我考上了。县里最好的高中。\n\n我从学校一路跑回家，想告诉妈妈。\n\n门是开着的。\n\n我喊她。没人应。\n\n我进去。\n\n她在血里。\n\n旁边站着一个人。\n\n我认得他。他是妈妈的病人。\n\n他手里有刀。\n\n他看见我，愣住了。\n\n我没有叫。我只是站在那里，看着他。\n\n他把刀放下，从后门跑了。\n\n我没有追。' },
  { date: '2020-06-09', text: '妈。\n\n妈你起来。\n\n他不是来复查的吗。\n\n你不是说他眼睛快好了吗。\n\n妈。\n\n妈！！！\n\n我求你了。\n\n我求你了。\n\n你睁开眼睛看看我。\n\n我考上高中了。\n\n我考上了啊。' },
  { date: '2020-06-20', text: '妈妈下葬了。\n\n村里来了很多人。有的人哭了，有的人没哭。\n\n王叔没来。\n\n晚上姥姥坐在院子里，抽了很久的烟。\n\n她没说话。我也没说话。\n\n院子里只有虫叫。' },
  { date: '2020-09-15', text: '开学了。\n\n我搬去县里住。学校旁边租了一间小房子，房东是个老太太，人不错。\n\n妈妈留下的一些钱，加上姥姥给的一点，够我用到高中毕业。\n\n第一晚我一个人躺在床上，屋顶有裂纹。\n\n我盯着那条裂纹看了很久。\n\n我想妈妈。\n\n我恨王叔。\n\n我恨那个村子。\n\n我恨他们所有人。' },
  { date: '2021-02-18', text: '今天我十六岁了。\n\n姥姥从村里来看我，带了一篮鸡蛋，还煮了一碗面。\n\n面里卧着一个荷包蛋，没有别的。\n\n她说，囡囡，你已经十六了。\n\n我说嗯。\n\n她说，你学好了就走，别回头。\n\n我说好。\n\n她走的时候，在门口站了很久。我看着她上车的背影，忽然很想叫她。\n\n但我没有。' },
  { date: '2021-08-20', text: '暑假回了一趟村子。\n\n姥姥把她的东西都给了我。\n\n一个旧木盒，里面有几本手抄的册子，字很小，是她自己写的。\n\n她说，这些本来不该传给你。\n\n我问，为什么。\n\n她说，因为你不是那种人。\n\n我说，现在我是了。\n\n她看了我很久。\n\n然后她说，好。' },
  { date: '2022-05-06', text: '正式搬出来了。\n\n把姥姥给的东西也带来了，放在床底下的箱子里。\n\n白天上课，晚上回来，一个人做饭，一个人吃。\n\n有时候夜里会想起妈妈。\n\n想她笑起来的样子。\n\n想她说的，病有时候比苦还难受。\n\n妈妈，我现在比苦还难受。' },

const LOCK2_FROM_INDEX = 14;

let unlocked  = false;

const LOCK_KEY = 'arg_treehole_locks';

function loadLocks() {
  try {
    const s = JSON.parse(localStorage.getItem(LOCK_KEY) || '{}');
    unlocked  = !!s.unlocked;
    unlocked2 = !!s.unlocked2;
  } catch (e) {}
}
function saveLocks() {
  try {
    localStorage.setItem(LOCK_KEY, JSON.stringify({
      unlocked: unlocked,
      unlocked2: unlocked2
    }));
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function defaultAvatar(name) {
  const letter = name ? name.charAt(0) : '?';
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
    '<circle cx="50" cy="50" r="50" fill="#c9ced6"/>' +
    '<text x="50" y="63" font-size="44" text-anchor="middle" fill="#ffffff" ' +
    'font-family="sans-serif">' + letter + '</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* ============================================================
   渲染主空间（林凯）
   ============================================================ */
function render() {
  const posts = getPosts();
  const yearBar = document.getElementById('yearBar');

  if (currentUser) {
    const years = [...new Set(posts.map(p => p.date.slice(0, 4)))].sort();
    if (!currentYear || !years.includes(currentYear)) {
      currentYear = years[0];
    }
    yearBar.classList.add('show');
    yearBar.innerHTML = years.map(y =>
      '<button class="year-btn' + (y === currentYear ? ' active' : '') +
      '" onclick="selectYear(\'' + y + '\')">' + y + ' 年</button>'
    ).join('');
  } else {
    currentYear = null;
    yearBar.classList.remove('show');
    yearBar.innerHTML = '';
  }

  const indexed = posts.map((p, i) => ({ post: p, absIndex: i }));
  const visible = currentUser
    ? indexed.filter(item => item.post.date.startsWith(currentYear))
    : indexed;

  const applyLock = (currentUser === 'linkai');
  let html = '';
  let lock1Shown = false;
  let lock2Shown = false;

  for (const item of visible) {
    const { post, absIndex } = item;

    if (applyLock && !unlocked && absIndex >= LOCK_FROM_INDEX && absIndex < LOCK2_FROM_INDEX) {
      if (!lock1Shown) { html += renderLock1(); lock1Shown = true; }
      continue;
    }
    if (applyLock && !unlocked2 && absIndex >= LOCK2_FROM_INDEX) {
      if (!lock2Shown) { html += renderLock2(); lock2Shown = true; }
      continue;
    }
    html += renderPost(post);
  }

  const feed = document.getElementById('feed');
  feed.innerHTML = html || '<div class="empty">这一年还没有动态。</div>';

  const prof = getProfile();
  document.getElementById('profileName').textContent = prof.nick || prof.name;
  document.getElementById('profileAccount').textContent = prof.account || '';
  document.getElementById('profileSig').textContent = prof.sig || '';

  const avatar = document.getElementById('avatarImg');
  avatar.src = prof.avatar ? prof.avatar : defaultAvatar(prof.name);
  avatar.alt = prof.name;

  document.body.className = currentUser ? 'bg-eerie' : 'bg-normal';
}

function selectYear(y) {
  currentYear = y;
  render();
}

function tryUnlock() {
  const box = document.getElementById('lockInput');
  const tip = document.getElementById('lockTip');
  if (!box) return;
  if (box.value.trim() === LOCK_PASSWORD) {
    unlocked = true;
    saveLocks();
    render();
  } else {
    if (tip) tip.textContent = '密码不对，再想想';
  }
}

  const box = document.getElementById('lockInput2');

function toggleLoginPanel() {
  if (currentUser) {
    currentUser = null;
    currentYear = null;
    updateTopbar();
    render();
    return;

  document.getElementById('loginPanel').classList.toggle('open');
}

function updateTopbar() {
  document.getElementById('loginBtn').textContent = currentUser ? '退出' : '登录';
  document.getElementById('loginPanel').classList.remove('open');
}

function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginErr');
  err.textContent = '';

  if (!USERS[u]) {
    err.textContent = '账号不存在';
    return;
  }

  if (u === 'linkai') {
    if (p !== USERS.linkai.pass) {
      err.textContent = '密码错误';
      return;
    }
    currentUser = 'linkai';
    currentYear = null;
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    updateTopbar();
    render();
    return;
  }

  if (u === 'lien_0218') {
    if (p !== USERS.lien_0218.pass) {
      err.textContent = '密码错误';
      return;
    }
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    document.getElementById('loginPanel').classList.remove('open');
    show404();
    return;
  }
}

const SECRET_KEY = '#RETURN-12930#';

function show404() {
  document.getElementById('view-main').style.display = 'none';
  document.getElementById('viewLien').classList.remove('show');
  document.getElementById('view404').classList.add('show');
  document.body.className = 'bg-eerie';
  const help = document.getElementById('helpInput');

  const tip = document.getElementById('helpTip');
  if (tip) { tip.textContent = ''; tip.classList.remove('err'); }
  const btn = document.getElementById('loginBtn');
  if (btn) btn.textContent = '登录';
}

function doHelpSearch() {
  const v = document.getElementById('helpInput').value.trim();
  const tip = document.getElementById('helpTip');
  if (v === SECRET_KEY) {
    tip.textContent = '密钥验证通过，正在跳转……';
    tip.classList.remove('err');
    playRedTransition();
  } else if (v === '') {
    tip.textContent = '请输入关键词';
    tip.classList.add('err');
  } else {
    tip.textContent = '未找到匹配的页面';
    tip.classList.add('err');
  }
}

function playRedTransition() {
  if (document.getElementById('redOverlay')) return;

  const overlay = document.createElement('div');
  overlay.id = 'redOverlay';
  overlay.className = 'red-overlay';

  const words = [
    '#RETURN-12930#',
    '正在归位……',
    '她醒了',
    '祂在等你',
    '李恩',
    '……',
    '找到了',
    '数据恢复中',
    '不要回头',
    '你来了'
  ];

  for (let i = 0; i < 220; i++) {
    const span = document.createElement('span');
    span.textContent = words[Math.floor(Math.random() * words.length)];
    span.style.left = (Math.random() * 100) + '%';
    span.style.top = (Math.random() * 100) + '%';
    span.style.fontSize = (11 + Math.random() * 28) + 'px';
    span.style.animationDelay = (Math.random() * 0.9) + 's';
    overlay.appendChild(span);
  }

  document.body.appendChild(overlay);

  setTimeout(() => {
    showLien();
    setTimeout(() => {
      overlay.classList.add('fade-out');
      setTimeout(() => overlay.remove(), 750);
    }, 500);
  }, 1600);
}

function showLien() {
  document.getElementById('view404').classList.remove('show');
  document.getElementById('view-main').style.display = 'none';
  document.getElementById('viewLien').classList.add('show');
  document.body.className = 'bg-lien';
